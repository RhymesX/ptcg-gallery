<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - ptcgGallery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-shell">
    <header class="hero">
        <div>
            <a class="back-link" href="/">← 返回首页</a>
            <h1>管理后台</h1>
            <p>账号管理、邀请码管理、爬虫控制。</p>
        </div>
    </header>

    <main class="admin-layout">
        <section class="panel">
            <h2>账号管理</h2>
            <label for="adminAccountSelect" class="field-label" style="margin-bottom:6px;">选择目标账号</label>
            <div class="admin-reset-row">
                <select id="adminAccountSelect" aria-label="目标账号"></select>
                <input id="adminResetPasswordInput" type="password" placeholder="新密码（≥4位）">
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
                <button id="adminResetBtn" type="button" class="danger" style="flex:1;">重置密码</button>
                <button id="adminDeleteAccountBtn" type="button" class="danger">删除账号</button>
            </div>
            <p class="status-line" id="accountStatus" style="margin-top:8px;"></p>
        </section>

        <section class="panel">
            <h2>邀请码管理</h2>
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button id="generateInviteBtn" type="button" style="flex:1;">生成 1 天邀请码</button>
                <button id="generateInvite10DaysBtn" type="button" style="flex:1;">生成 10 天邀请码</button>
            </div>
            <div id="inviteCodeList" style="font-size:12px;color:var(--muted);">
                <p id="inviteEmptyMsg">暂无有效邀请码</p>
            </div>
            <p class="status-line" id="inviteStatus" style="margin:4px 0 0;"></p>
            <div style="margin-top:8px;display:flex;align-items:center;gap:8px;">
                <span style="font-size:12px;color:var(--muted);">注册邀请码开关</span>
                <button id="toggleInviteBtn" type="button" style="font-size:12px;">加载中...</button>
            </div>
        </section>

        <section class="panel">
            <h2>昵称管理</h2>
            <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">
                更新 data/nicknames.xlsx 后，点击下方按钮即可重新加载，无需重启服务。
            </p>
            <button id="reloadNicknamesBtn" type="button">从 Excel 重新加载昵称</button>
            <p class="status-line" id="nicknameReloadStatus" style="margin-top:8px;"></p>
        </section>

        <section class="panel">
            <h2>卡图下载</h2>
            <div class="section-head compact-head">
                <span class="section-count" id="crawlerModeLabel">仅本地</span>
            </div>
            <div class="crawler-buttons">
                <button id="crawlerOffBtn" type="button" class="secondary crawler-mode-btn is-active">仅本地</button>
                <button id="crawlerDemandBtn" type="button" class="secondary crawler-mode-btn">点开下载</button>
                <button id="crawlerOnBtn" type="button" class="secondary crawler-mode-btn">持续爬取</button>
                <button id="crawlerScheduledBtn" type="button" class="secondary crawler-mode-btn">凌晨3点</button>
            </div>
            <p class="status-line" id="crawlerStatus">当前：仅本地图片（不自动下载）</p>
        </section>

        <section class="panel">
            <h2>缓存图片验证</h2>
            <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">
                逐张对比本地缓存与 mikmoe 源图，不匹配的自动删除让爬虫重新下载。
            </p>
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <input id="verifyProductCodeInput" type="text" placeholder="产品编号，如 CSV10C"
                       style="flex:1;font-size:13px;padding:4px 8px;">
                <button id="verifyProductBtn" type="button" style="font-size:13px;">检查单个产品</button>
            </div>
            <button id="verifyAllBtn" type="button" class="danger">检查全部缓存（耗时较长）</button>
            <div id="verifyResult" style="margin-top:8px;font-size:12px;color:var(--muted);">
                <div id="verifyProgress" style="display:none;margin-bottom:4px;">
                    <span>正在验证：</span><strong id="verifyCurrentPc"></strong>
                </div>
                <div id="verifyHistoryContainer" style="margin-bottom:8px;"></div>
                <pre id="verifyOutput" style="background:var(--bg);padding:8px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;display:none;"></pre>
            </div>
        </section>
    </main>
</div>

<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
