<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌仓库 - ptcgGallery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-shell holdings-page">
    <header class="hero holdings-hero">
        <div>
            <a class="back-link" href="/">← 返回主页</a>
            <h1>卡牌仓库</h1>
            <p>按分类分开展示，每一张卡都是数据表中的原始记录，不会把不同记录合并统计。</p>
        </div>
        <div class="holdings-hero-actions">
            <div class="toolbar compact holdings-hero-toolbar">
                <a class="button-link secondary" href="/inventory-table">打开库存表格</a>
                <a class="button-link secondary" href="/decks">打开卡组管理</a>
            </div>
            <div class="stats" id="summaryCards"></div>
        </div>
    </header>

    <main class="holdings-main">
        <div class="holdings-note">
            <div class="holdings-note-text">
                <strong>说明：</strong>
                <span>总持有 = 空闲 + 各卡组数量；卡组数量区域仅用背景色区分，颜色对应关系见右侧提示。</span>
            </div>
            <div class="deck-legend" id="deckLegend"></div>
        </div>
        <div id="holdingsContent" class="holdings-content"></div>
    </main>
</div>

<template id="holdingsSectionTemplate">
    <section class="holdings-section">
        <div class="section-head">
            <h2 class="section-title"></h2>
            <span class="section-count"></span>
        </div>
        <div class="group-list"></div>
    </section>
</template>

<script src="{{ url_for('static', filename='holdings.js') }}"></script>
</body>
</html>
