<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ptcgGallery - 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--panel);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: var(--shadow);
            width: min(400px, 90vw);
            text-align: center;
        }
        .login-card h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }
        .login-card .sub {
            color: var(--muted);
            margin: 0 0 28px;
            font-size: 14px;
        }
        .login-card .field {
            text-align: left;
            margin-bottom: 16px;
        }
        .login-card .field label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .login-card button {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            font-size: 16px;
        }
        .login-error {
            color: var(--danger);
            margin-bottom: 12px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body class="login-shell">
    <div class="login-card">
        <h1>ptcgGallery</h1>
        <p class="sub">请输入用户名和密码以继续</p>

        <div class="login-error" id="loginError">{{ error or '' }}</div>

        <form method="post" action="/login">
            <div class="field">
                <label for="username">用户名</label>
                <input id="username" name="username" type="text" placeholder="输入用户名" required autofocus autocomplete="username">
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" placeholder="输入密码" required autocomplete="current-password">
            </div>
            <button type="submit">登 录</button>
        </form>

        <hr style="margin:24px 0;border-color:var(--border)">
        <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">还没有账号？请在下方注册（需要邀请码）：</p>
        <div id="registerStatus" style="color:var(--danger);margin-bottom:8px;font-size:13px;min-height:18px;"></div>
        <div class="field">
            <label for="regName">新用户名</label>
            <input id="regName" type="text" placeholder="输入新用户名" autocomplete="off">
        </div>
        <div class="field">
            <label for="regPwd">新密码（≥4位）</label>
            <input id="regPwd" type="password" placeholder="输入新密码" autocomplete="new-password">
        </div>
        <div class="field">
            <label for="regInvite">邀请码</label>
            <input id="regInvite" type="text" placeholder="输入邀请码" autocomplete="off">
        </div>
        <button id="registerBtn" type="button">注 册</button>
    </div>

    <script>
    document.getElementById('registerBtn').addEventListener('click', async () => {
        const name = document.getElementById('regName').value.trim();
        const password = document.getElementById('regPwd').value.trim();
        const inviteCode = document.getElementById('regInvite').value.trim();
        const statusEl = document.getElementById('registerStatus');
        const errorEl = document.getElementById('loginError');
        if (!name) { statusEl.textContent = '请输入用户名'; return; }
        if (!password || password.length < 4) { statusEl.textContent = '密码至少需要 4 位'; return; }
        if (!inviteCode) { statusEl.textContent = '请输入邀请码'; return; }
        try {
            const resp = await fetch('/api/accounts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, password, inviteCode})
            });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                statusEl.textContent = err.error || '注册失败';
                return;
            }
            statusEl.style.color = 'var(--success,#2e7d32)';
            statusEl.textContent = '注册成功，正在登录...';
            // 注册成功后自动登录
            document.getElementById('username').value = name;
            document.getElementById('password').value = password;
            errorEl.textContent = '';
            document.querySelector('form[action="/login"]').submit();
        } catch (e) {
            statusEl.textContent = '网络错误，请重试';
        }
    });
    document.getElementById('regPwd').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('registerBtn').click(); }
    });
    </script>
</body>
</html>
